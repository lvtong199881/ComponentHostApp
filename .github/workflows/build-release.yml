name: 构建 Release APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'

      - name: 恢复 keystore 文件
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_FILE }}" | base64 -d > app/release.jks

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 提取版本号
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "ver=$VERSION" >> $GITHUB_OUTPUT

      - name: 构建 Release APK
        run: ./gradlew assembleRelease

      - name: 重命名 APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-v${{ steps.version.outputs.ver }}.apk

      - name: 上传至 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-v${{ steps.version.outputs.ver }}.apk
          tag_name: v${{ steps.version.outputs.ver }}
          release_name: Release v${{ steps.version.outputs.ver }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
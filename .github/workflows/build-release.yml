name: 构建 Release APK

on:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
      packages: write

    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'

      - name: 恢复 keystore 文件
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_FILE }}" | base64 -d > app/release.jks

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 提取版本号
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          UUID=$(uuidgen | tr -d '-')
          FULL_VERSION="${VERSION}-${UUID}"
          echo "ver=$VERSION" >> $GITHUB_OUTPUT
          echo "full_ver=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: 构建 Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease

      - name: 上传至 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-armeabi-v7a.apk
          tag_name: v${{ steps.version.outputs.full_ver }}
          name: Release v${{ steps.version.outputs.full_ver }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传 ARM64 APK
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release-arm64-v8a.apk
          tag_name: v${{ steps.version.outputs.full_ver }}-arm64
          name: Release v${{ steps.version.outputs.full_ver }} (ARM64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
